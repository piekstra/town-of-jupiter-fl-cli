name: release

# Cut a release by pushing a tag like `v0.5.0`. Cross-platform artifacts live
# here rather than in per-push CI, so the expensive macOS runner (about 10x
# Linux) and the Windows runner (about 2x) are billed once per release
# instead of once per commit. One job per OS: Linux, Windows, and ONE macOS
# job (Apple Silicon, which cross-compiles the Intel target; the macOS SDK is
# universal). Build jobs are independent (fail-fast: false), so a slow or dead
# macOS queue never stops the Linux and Windows builds; only `publish` attaches,
# and re-running the failed jobs finishes the draft it leaves. The `.mcpb`
# (Claude Desktop extension) needs all three, so it is packed last, on Linux.
#
# Only `publish`, which runs on a tag alone and runs no third-party build
# code, can write to the repository; building and packing (cargo, npx)
# happen with a read-only token that checkout does not persist.
#
# The versions are checked before anything is built: the tag, Cargo.toml,
# version.txt and the .mcpb manifest must agree, or nothing is built or published.
# `publish` attaches whatever was built to a draft, even when one OS failed, and
# publishes it only once every expected asset is there. A missing one fails the
# run and leaves the draft, and `self-update` keeps finding the last whole release.
#
# A pull request that changes how releases are built, or the dependencies
# and version (Cargo.toml, Cargo.lock), runs every job but `publish` as a
# dry run: everything is built and packed, nothing is attached to a
# release. The Windows and macOS builds run nowhere else, so a dependency
# that breaks them shows on its pull request, not on the tag. The version
# agreement also runs on every pull request, in
# crates/tojfl-cli/tests/packaging.rs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The manifest's version must be the crate's, and on a tag the tag's, or
  # self-update and Claude Desktop would see one version and run another.
  versions:
    name: check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag, Cargo.toml, version.txt and manifest agree
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$(tr -d '[:space:]' < version.txt)" != "$version" ]; then
            echo "::error::version.txt does not match Cargo.toml version $version"
            exit 1
          fi
          manifest_version=$(jq -r .version packaging/mcpb/manifest.json)
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::packaging/mcpb/manifest.json is $manifest_version but Cargo.toml is $version"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: build ${{ matrix.name }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
          - os: windows-latest
            name: windows x86_64
            targets: "x86_64-pc-windows-msvc"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      # Asset names are the contract `tojfl self-update` resolves against:
      # tojfl-v<version>-<target>.tar.gz plus a sibling .sha256, the names every
      # earlier release used. The version comes from Cargo.toml, because on a
      # pull request's dry run the ref name is not a tag. The bare binaries also
      # go to bin/<target>/ for the .mcpb job.
      - name: Build and package each target
        run: |
          set -euo pipefail
          sha256() { if command -v shasum >/dev/null; then shasum -a 256 "$1"; else sha256sum "$1"; fi; }
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ]
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --locked -p tojfl-cli --target "$t"
            exe=tojfl
            case "$t" in *windows*) exe=tojfl.exe ;; esac
            asset="tojfl-v$version-$t.tar.gz"
            tar -C "target/$t/release" -czf "$asset" "$exe"
            sha256 "$asset" > "$asset.sha256"
            mkdir -p "bin/$t"
            cp "target/$t/release/$exe" "bin/$t/"
          done
      # Claude Desktop picks a binary by OS, not by CPU, so the .mcpb carries
      # one universal macOS binary.
      - name: Universal macOS binary
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin/universal-apple-darwin
          lipo -create -output bin/universal-apple-darwin/tojfl \
            bin/aarch64-apple-darwin/tojfl bin/x86_64-apple-darwin/tojfl
          lipo -info bin/universal-apple-darwin/tojfl
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ runner.os }}
          path: bin/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            tojfl-*.tar.gz
            tojfl-*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  mcpb:
    name: pack the Claude Desktop extension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The `versions` job has already held the manifest to Cargo.toml and
      # the tag.
      - name: Assemble, validate and pack
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          stage="$RUNNER_TEMP/tojfl"
          mkdir -p "$stage/server/linux"
          cp packaging/mcpb/manifest.json LICENSE "$stage/"
          cp bin/universal-apple-darwin/tojfl "$stage/server/tojfl"
          cp bin/x86_64-pc-windows-msvc/tojfl.exe "$stage/server/tojfl.exe"
          cp bin/x86_64-unknown-linux-gnu/tojfl "$stage/server/linux/tojfl"
          # Artifacts drop the executable bit; the .mcpb keeps what it is given.
          chmod +x "$stage/server/tojfl" "$stage/server/linux/tojfl"
          npx -y @anthropic-ai/mcpb@2.1.2 validate "$stage/manifest.json"
          npx -y @anthropic-ai/mcpb@2.1.2 pack "$stage" "tojfl-$version.mcpb"
          sha256sum "tojfl-$version.mcpb" > "tojfl-$version.mcpb.sha256"
          unzip -Z "tojfl-$version.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mcpb
          path: tojfl-*.mcpb*
          retention-days: 7
          if-no-files-found: error

  # Attaches whatever was built to a draft, even when one OS failed, so a dead
  # macOS queue still leaves the Linux and Windows tarballs there. Publishes the
  # draft only when nothing expected is missing, and otherwise fails. Never runs
  # when the versions disagree.
  publish:
    name: publish the release
    needs: [versions, build, mcpb]
    if: ${{ !cancelled() && needs.versions.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            dist/tojfl-*.tar.gz
            dist/tojfl-*.tar.gz.sha256
            dist/tojfl-*.mcpb
            dist/tojfl-*.mcpb.sha256
          generate_release_notes: true
      - name: Every expected asset was attached
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            for f in "tojfl-v$version-$t.tar.gz" "tojfl-v$version-$t.tar.gz.sha256"; do
              [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
            done
          done
          for f in "tojfl-$version.mcpb" "tojfl-$version.mcpb.sha256"; do
            [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit "$missing"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run of an older tag must not move Latest back to it.
          current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null) || echo "::warning::could not read the latest release, so this tag counts as the newest"
          newest=$(printf '%s\n%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -1)
          latest=false; [ "$newest" = "$GITHUB_REF_NAME" ] && latest=true
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
